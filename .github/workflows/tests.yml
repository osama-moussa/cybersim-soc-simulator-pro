name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.js
      - name: Check JavaScript syntax
        run: for file in js/*.js js/ui/*.js; do node --check "$file"; done
